*{box-sizing:border-box}

#title{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px dashed var(--line);width:100%;padding:0 0 4px}
#title[readonly]{border-bottom-color:transparent}
.details-text{white-space:pre-wrap;overflow-wrap:anywhere}
:root[data-trip-mode="view"] #mapbox,:root[data-trip-mode="view"] .pin{touch-action:pan-y}

.sub{color:var(--mute);margin:0 0 14px}

main{max-width:980px;margin:0 auto;padding:16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
form.add .wide{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:block}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn{font:700 14px "DM Sans",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--sea);color:var(--seaink);border-color:var(--sea)}

.ev{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.time{min-width:64px;font-weight:700;color:var(--sea)}
.ev h3{margin:0;font-size:17px}

.pin.sel .b{background:var(--sea);outline:3px solid var(--sun)}

.hint{font-size:13px;color:var(--mute)}
.sw{width:36px;height:36px;border-radius:18px;border:2px solid var(--line);cursor:pointer}

.btn:disabled{opacity:.6;cursor:wait}
.lnk{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0}
.gal img{width:100%;border-radius:8px;display:block;margin-bottom:6px}
.menu{position:relative;align-self:flex-start}
.dots{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;width:36px;height:36px;border-radius:18px;cursor:pointer}
.dots:hover,.dots[aria-expanded=true]{background:var(--bg);color:var(--ink)}

.pop button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 14px "DM Sans",sans-serif;padding:10px 12px;cursor:pointer}
.pop button:hover{background:var(--bg)}
.tl{border-left:3px solid var(--sea);margin-left:8px;padding-left:18px}
.tl .row{position:relative;margin-bottom:14px}
.tl .row::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:6px;background:var(--sun);border:2px solid var(--sea)}
.tl .t{font-weight:700;color:var(--sea)}

  '<div class="wide"><button class="btn pri" type="submit">Add event</button></div></form>':'';
  if(!g.length)return h+'<div class="empty">'+(isEditing()?'No events yet. Add one above.':'No events yet. Switch to edit mode in Settings to add one.')+'</div>';
  g.forEach(function(d){h+='<div class="day">'+esc(dayLabel(d.n))+'</div>';
    d.list.forEach(function(e){if(S.editing===e.id){h+=editHTML(e);return;}h+='<div class="card ev"><div class="time">'+esc(e.time||"–")+(e.end?'<div class="hint">to '+esc(e.end)+'</div>':'')+'</div><div style="flex:1"><h3><button class="lnk" data-act="open" data-id="'+e.id+'">'+esc(T(e,"title"))+'</button>'+(e.text||e.textZh||(e.pics&&e.pics.length)?' 📝':'')+'</h3>'+
    '<p>'+(T(e,"loc")?esc(T(e,"loc")):"No location")+(T(e,"notes")?" — "+esc(T(e,"notes")):"")+(isZh(e)&&!(e.titleZh||e.locZh||e.notesZh||e.textZh)?(isEditing()?' (No Chinese version yet. Add one with ⋮ Edit.)':' (No Chinese version yet.)'):'')+'</p><div class="acts">'+
    '<button class="btn sm pri" data-act="map" data-id="'+e.id+'">📍 View on map</button>'+
    languageButton(e)+
    '<a class="btn sm" target="_blank" rel="noopener" href="'+gmaps(e)+'">Open in Google Maps</a>'+
    '</div></div>'+(e.pin?'<span class="badge">'+esc(labelOf(e))+'</span>':'')+(isEditing()?menuHTML(e):'')+'</div>';});});
  return h;
}
function mapHTML(){
  var s=S.sel?byId(S.sel):null;
  var mi=S.mapimgs[S.curMap];var h='<div class="maplay"><div>'+mapBar()+'<div id="mapbox" class="'+(mi?"img":"")+(S.placing?" placing":"")+'"'+(mi?' style="background-image:url('+mi+')"':'')+'>';
  S.events.forEach(function(e){if(e.pin&&e.map===S.curMap)h+='<div class="pin'+(e.id===S.sel?" sel":"")+'" data-id="'+e.id+'"'+(!isEditing()?' data-sel="'+e.id+'" role="button" tabindex="0" aria-label="'+esc(e.title)+'"':'')+' style="left:'+e.pin.x+'%;top:'+e.pin.y+'%"><div class="b">'+esc(labelOf(e))+'</div><small>'+esc(e.title)+'</small></div>';});
  h+='</div><p class="hint">'+(isEditing()?(S.placing&&s?'Click the map to drop a pin for “'+esc(s.title)+'”.':'Drag pins to move them. Upload a screenshot of your map to use as the background.'):'Select an event to see its pin.')+'</p>'+
  '<div class="acts" style="margin:8px 0"><input id="msearch" placeholder="Search a place name" style="flex:1;min-width:160px"><button class="btn sm pri" data-act="srch" data-src="g">Google Maps</button><button class="btn sm" data-act="srch" data-src="o">OpenStreetMap</button></div>'+
  (isEditing()?'<div class="acts"><label class="btn sm" style="cursor:pointer">Upload map image<input id="mapfile" type="file" accept="image/*" hidden></label>'+(mi?'<button class="btn sm" id="clrimg">Use plain grid</button>':'')+'</div>':'')+'</div>'+
  '<div class="card side"><strong>Events</strong>';
  if(!S.events.length)h+='<div class="empty">'+(isEditing()?'Add events on the Itinerary tab.':'No events yet.')+'</div>';
  sorted().forEach(function(e){h+='<div class="item" data-sel="'+e.id+'" tabindex="0" role="button" aria-current="'+(e.id===S.sel)+'"><span class="badge" style="'+(e.pin?'':'background:var(--line);color:var(--mute)')+'">'+esc(e.pin?labelOf(e):"–")+'</span><span>'+esc(e.title)+'</span></div>';});
  if(s){h+='<hr style="border:0;border-top:1px solid var(--line);margin:10px 0">'+(!isEditing()&&!s.pin?'<p class="hint">No pin has been added for this event.</p>':'')+'<div class="acts">'+(isEditing()?'<button class="btn sm pri" id="place">'+(s.pin?"Move pin":"Place pin")+'</button>'+(s.pin?'<button class="btn sm" id="rmpin">Remove pin</button>':''):'')+
  '<a class="btn sm" target="_blank" rel="noopener" href="'+gmaps(s)+'">Google Maps</a></div>'+(isEditing()?'<label style="margin-top:10px">Pin label</label><div class="emojis"><button data-lab="#" title="Number" aria-label="Use number">#</button>'+
  EMOJI.map(function(m){return '<button data-lab="'+m+'">'+m+'</button>';}).join("")+'</div><input id="custom" maxlength="3" placeholder="Or type 1–3 characters">':'');}
  return h+'</div></div>';
}
function timeHTML(g){
  if(!g.length)return '<div class="empty">Your timeline will appear here once you add events.</div>';
  var h="";
  g.forEach(function(d){h+='<div class="day">'+esc(dayLabel(d.n))+'</div><div class="tl">';
    d.list.forEach(function(e){h+='<div class="row"><div class="t">'+esc(e.time||"Any time")+(e.end?" – "+esc(e.end):"")+'</div><div><strong>'+esc(T(e,"title"))+'</strong>'+' '+languageButton(e)+(e.pin?' <span class="badge">'+esc(labelOf(e))+'</span>':'')+'</div>'+(T(e,"loc")?'<div class="hint">'+esc(T(e,"loc"))+'</div>':'')+(T(e,"notes")?'<div class="hint event-notes details-text">'+esc(T(e,"notes"))+'</div>':'')+'</div>';});
    h+='</div>';});
  return h;
}
function ink(h){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000>150?"#07191d":"#fff";}
function saveSet(){try{localStorage.setItem("tripplanner:set",JSON.stringify(S.set));}catch(e){}}
function applySet(){var r=document.documentElement,s=S.set;
  if(s.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",s.theme);
  if(s.accent){r.style.setProperty("--sea",s.accent);r.style.setProperty("--seaink",ink(s.accent));}else{r.style.removeProperty("--sea");r.style.removeProperty("--seaink");}
  if(s.mapbg)r.style.setProperty("--mapbg",s.mapbg);else r.style.removeProperty("--mapbg");}
function sw(key,list,cur){return list.map(function(c){return '<button class="sw'+((cur||"")===c[0]?" on":"")+'" data-set="'+key+'" data-v="'+c[0]+'" title="'+c[1]+'" aria-label="'+c[1]+'" style="background:'+(c[0]||"var(--grid)")+'"></button>';}).join("");}
function isZh(e){return (S.lang[e.id]||S.set.defLang)==="zh";}
function T(e,k){return isZh(e)&&e[k+"Zh"]?e[k+"Zh"]:e[k];}
function languageButton(e){return '<button class="btn sm" data-act="lang" data-id="'+e.id+'" aria-pressed="'+isZh(e)+'">'+(isZh(e)?"English":"中文")+'</button>';}
function menuHTML(e){var o=S.menu===e.id;return '<div class="menu"><button class="dots" data-act="menu" data-id="'+e.id+'" aria-label="Event options" aria-expanded="'+o+'">⋮</button>'+(o?'<div class="pop"><button data-act="edit" data-id="'+e.id+'">✏️ Edit</button><button data-act="del" data-id="'+e.id+'">🗑️ Delete</button></div>':'')+'</div>';}
function editHTML(e){return '<form class="add card" id="editf" data-id="'+e.id+'" style="margin-bottom:10px"><div class="wide"><label for="e-t">Event</label><input id="e-t" required value="'+esc(e.title)+'"></div><div><label for="e-d">Day</label><input id="e-d" type="number" min="1" step="1" required value="'+esc(e.day||1)+'"></div><div><label for="e-h">Start time</label><input id="e-h" type="time" value="'+esc(e.time)+'"></div><div><label for="e-e">End time (optional)</label><input id="e-e" type="time" value="'+esc(e.end)+'"></div><div class="wide"><label for="e-l">Location</label><input id="e-l" value="'+esc(e.loc)+'"></div><div class="wide"><label for="e-n">Notes</label><input id="e-n" value="'+esc(e.notes)+'"></div><details class="wide"'+(e.titleZh||e.locZh||e.notesZh?' open':'')+'><summary>Chinese version (optional)</summary><div style="display:grid;gap:8px;margin-top:8px"><input id="e-tz" lang="zh" placeholder="中文标题" aria-label="Chinese title" value="'+esc(e.titleZh)+'"><input id="e-lz" lang="zh" placeholder="中文地点" aria-label="Chinese location" value="'+esc(e.locZh)+'"><input id="e-nz" lang="zh" placeholder="中文备注" aria-label="Chinese notes" value="'+esc(e.notesZh)+'"></div></details><div class="wide acts"><button class="btn pri" type="submit">Save changes</button><button class="btn" type="button" data-act="cancel">Cancel</button></div></form>';}
function setHTML(){
  var AC=[["#0e7c86","Teal"],["#e4572e","Coral"],["#6a4fd8","Violet"],["#2e8b57","Green"],["#d6336c","Pink"],["#d98e04","Amber"]];
  var MC=[["","Default"],["#cfe8ef","Sea"],["#e3efd5","Meadow"],["#f4e8cf","Sand"],["#e6dcf2","Lilac"],["#2b3a42","Slate"]];
  var th=[["auto","Auto"],["light","Light"],["dark","Dark"]];
  return '<div class="card"><h2 class="day" id="mode-heading" style="margin-top:0">Trip mode</h2><div class="acts" role="group" aria-labelledby="mode-heading" aria-describedby="mode-help">'+[["view","View mode"],["edit","Edit mode"]].map(function(m){return '<button class="btn'+(S.mode===m[0]?' pri':'')+'" data-mode="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>';}).join('')+'</div><p class="hint" id="mode-help">'+(S.mode==='view'?'View mode is on. Browse the trip without changing it. Choose Edit mode to make changes.':'Edit mode is on. You can change events, maps, and trip details.')+' The trip opens in view mode each time you load the page.</p><h2 class="day">Trip start date</h2>'+(isEditing()?'<input type="date" data-startdate="1" value="'+esc(S.start)+'" aria-label="Trip start date" style="max-width:200px">':'<p>'+esc(S.start?fmtDay(S.start):'No start date set.')+'</p>')+'<p class="hint">This date is Day 1. Events use a day number, and the real dates are worked out from here.</p><h2 class="day">Theme</h2><div class="acts">'+th.map(function(t){return '<button class="btn sm'+(S.set.theme===t[0]?' pri':'')+'" data-set="theme" data-v="'+t[0]+'" aria-pressed="'+(S.set.theme===t[0])+'">'+t[1]+'</button>';}).join("")+'</div><p class="hint">Auto follows your device.</p>'+
  '<h2 class="day">Theme colour</h2><div class="acts">'+sw("accent",AC,S.set.accent)+'<input type="color" data-setc="accent" value="'+(S.set.accent||"#0e7c86")+'" aria-label="Custom theme colour" style="width:44px;height:36px;padding:2px"></div>'+
  '<h2 class="day">Map colour</h2><div class="acts">'+sw("mapbg",MC,S.set.mapbg)+'<input type="color" data-setc="mapbg" value="'+(S.set.mapbg||"#dbe7e8")+'" aria-label="Custom map colour" style="width:44px;height:36px;padding:2px"></div><p class="hint">Shows behind your pins when no map image is uploaded.</p>'+
  '<h2 class="day">Default event language</h2><div class="acts">'+[["en","English"],["zh","中文"]].map(function(t){return '<button class="btn sm'+(S.set.defLang===t[0]?' pri':'')+'" data-set="defLang" data-v="'+t[0]+'" aria-pressed="'+(S.set.defLang===t[0])+'">'+t[1]+'</button>';}).join("")+'</div><p class="hint">Events with a Chinese version open in Chinese. You can still switch any single event with its own button.</p>'+
  '<div style="margin-top:16px"><button class="btn sm" data-set="reset">Reset to defaults</button></div></div>';}
function bindMap(){
  var box=document.getElementById("mapbox");
  box.addEventListener("click",function(ev){
    if(!isEditing()||!S.placing||!S.sel)return;
    var r=box.getBoundingClientRect(),e=byId(S.sel);
    e.pin={x:Math.round((ev.clientX-r.left)/r.width*1000)/10,y:Math.round((ev.clientY-r.top)/r.height*1000)/10};e.map=S.curMap;
    S.placing=false;save();render();
  });
  box.querySelectorAll(".pin").forEach(function(p){
    p.addEventListener("pointerdown",function(ev){
      if(!isEditing())return;
      ev.stopPropagation();var id=+p.dataset.id,e=byId(id),moved=false;S.sel=id;p.setPointerCapture(ev.pointerId);
      var r=box.getBoundingClientRect();
      function mv(m){moved=true;var x=Math.max(0,Math.min(100,(m.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(m.clientY-r.top)/r.height*100));
        e.pin={x:Math.round(x*10)/10,y:Math.round(y*10)/10};p.style.left=e.pin.x+"%";p.style.top=e.pin.y+"%";}
      function up(){p.removeEventListener("pointermove",mv);p.removeEventListener("pointerup",up);save();render();}
      p.addEventListener("pointermove",mv);p.addEventListener("pointerup",up);
    });
  });
  var mn=document.getElementById("mapname");if(mn){mn.addEventListener("input",function(){curMapObj().name=mn.value;save();});mn.addEventListener("change",render);}
  var f=document.getElementById("mapfile");
  if(f)f.addEventListener("change",function(){var file=f.files[0];if(!file)return;var rd=new FileReader();
    rd.onload=function(){var im=new Image();im.onload=function(){var sc=Math.min(1,1400/im.width),c=document.createElement("canvas");
      c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      S.mapimgs[S.curMap]=c.toDataURL("image/jpeg",.8);saveImgs();render();};im.src=rd.result;};rd.readAsDataURL(file);});
  var cl=document.getElementById("clrimg");
  if(cl)cl.addEventListener("click",function(){delete S.mapimgs[S.curMap];saveImgs();render();});
  var pl=document.getElementById("place");if(pl)pl.addEventListener("click",function(){S.placing=true;render();});
  var rm=document.getElementById("rmpin");if(rm)rm.addEventListener("click",function(){byId(S.sel).pin=null;save();render();});
  var cu=document.getElementById("custom");
  if(cu)cu.addEventListener("change",function(){if(cu.value.trim()){byId(S.sel).label=cu.value.trim();save();render();}});
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-sel],[data-lab],[data-map]");if(!t){if(S.menu!==null){S.menu=null;render();}return;}
  if(!isEditing()&&(t.dataset.lab||['addmap','delmap','delpic','publish','menu','edit','del'].indexOf(t.dataset.act)!==-1))return;
  if(t.dataset.act==="map"){var e=byId(+t.dataset.id);S.sel=e.id;if(e.pin&&e.map)S.curMap=e.map;S.placing=isEditing()&&!e.pin;S.tab="map";render();window.scrollTo(0,0);}
  else if(t.dataset.map){S.curMap=+t.dataset.map;S.placing=false;S.confirmDel=false;render();}
  else if(t.dataset.act==="addmap"){var nid=S.maps.reduce(function(m,x){return Math.max(m,x.id);},0)+1;S.maps.push({id:nid,name:"Map "+nid});S.curMap=nid;S.placing=false;save();render();}
  else if(t.dataset.act==="delmap"){if(!S.confirmDel){S.confirmDel=true;render();}else{var did=S.curMap;S.maps=S.maps.filter(function(m){return m.id!==did;});S.events.forEach(function(e){if(e.map===did){e.pin=null;e.map=null;}});delete S.mapimgs[did];saveImgs();S.curMap=S.maps[0].id;S.confirmDel=false;save();render();}}
  else if(t.dataset.act==="open"){S.detail=+t.dataset.id;S.menu=null;render();window.scrollTo(0,0);}
  else if(t.dataset.act==="back"){S.detail=null;render();}
  else if(t.dataset.act==="delpic"){var de=byId(S.detail);if(de&&de.pics){de.pics.splice(+t.dataset.i,1);save();render();}}
  else if(t.dataset.act==="publish"){publishSite();}
  else if(t.dataset.act==="retry"){loadSite();}
  else if(t.dataset.act==="loadsite"){loadSite(true);}
  else if(t.dataset.act==="download"){downloadDraft();}
  else if(t.dataset.act==="lang"){var lid=+t.dataset.id;S.lang[lid]=isZh(byId(lid))?"en":"zh";render();}
  else if(t.dataset.act==="menu"){var mid=+t.dataset.id;S.menu=S.menu===mid?null:mid;render();}
  else if(t.dataset.act==="edit"){S.editing=+t.dataset.id;S.menu=null;render();}
  else if(t.dataset.act==="cancel"){S.editing=null;render();}
  else if(t.dataset.act==="srch"){var qi=document.getElementById(S.tab==="plan"?"f-l":"msearch"),q=qi?qi.value.trim():"";if(!q)return;
    window.open((t.dataset.src==="o"?"https://www.openstreetmap.org/search?query=":"https://www.google.com/maps/search/?api=1&query=")+encodeURIComponent(q),"_blank","noopener");}
  else if(t.dataset.act==="del"){S.menu=null;S.events=S.events.filter(function(e){return e.id!==+t.dataset.id;});save();render();}
  else if(t.dataset.sel){S.sel=+t.dataset.sel;S.placing=false;render();}
  else if(t.dataset.lab&&S.sel){byId(S.sel).label=t.dataset.lab;save();render();}
});
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-mode]");if(!t||S.loading)return;var mode=t.dataset.mode;if(mode!=="view"&&mode!=="edit")return;setMode(mode);render();});
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-set]");if(!t)return;var k=t.dataset.set;
  if(k==="reset"){S.set={theme:"auto",accent:"",mapbg:"",defLang:"en"};S.lang={};setMode('view');}else{S.set[k]=t.dataset.v;if(k==="defLang")S.lang={};}saveSet();applySet();render();});
document.addEventListener("input",function(ev){var t=ev.target;if(!t.dataset||!t.dataset.setc)return;S.set[t.dataset.setc]=t.value;saveSet();applySet();});
document.addEventListener("change",function(ev){var t=ev.target;if(isEditing()&&t.dataset&&t.dataset.startdate){S.start=t.value;save();render();}});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.sel){ev.preventDefault();ev.target.click();}});
document.addEventListener("submit",function(ev){
  if(!isEditing()&&(ev.target.id==="editf"||ev.target.id==="addf")){ev.preventDefault();return;}
  if(ev.target.id==="editf"){ev.preventDefault();var ee=byId(+ev.target.dataset.id);ee.title=document.getElementById("e-t").value.trim();ee.day=parseInt(document.getElementById("e-d").value,10)||1;ee.time=document.getElementById("e-h").value;ee.end=document.getElementById("e-e").value;ee.loc=document.getElementById("e-l").value.trim();ee.notes=document.getElementById("e-n").value.trim();ee.titleZh=document.getElementById("e-tz").value.trim();ee.locZh=document.getElementById("e-lz").value.trim();ee.notesZh=document.getElementById("e-nz").value.trim();S.editing=null;save();render();publishSite();return;}
  if(ev.target.id!=="addf")return;ev.preventDefault();
  var id=Date.now()*1000+Math.floor(Math.random()*1000);
  S.events.push({id:id,title:document.getElementById("f-t").value.trim(),day:parseInt(document.getElementById("f-d").value,10)||1,time:document.getElementById("f-h").value,end:document.getElementById("f-e").value,
    loc:document.getElementById("f-l").value.trim(),notes:document.getElementById("f-n").value.trim(),titleZh:document.getElementById("f-tz").value.trim(),locZh:document.getElementById("f-lz").value.trim(),notesZh:document.getElementById("f-nz").value.trim(),pin:null,label:"#"});
  save();render();publishSite();
});
document.querySelector("nav").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;S.tab=b.dataset.tab;S.placing=false;if(S.tab==="plan")S.detail=null;render();});
document.getElementById("title").addEventListener("input",function(e){if(!isEditing())return;S.title=e.target.value;save();});
load();render();loadSite();
})();
</script></body></html>
